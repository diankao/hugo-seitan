# -- Theme Options --

colorScheme = "blowfish"
defaultAppearance = "light"
autoSwitchAppearance = true

enableSearch = true
disableImageOptimization = false

# 全站日期显示格式(文章页、卡片等)
dateFormat = "2006-01-02"

[header]
  layout = "basic"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  # 首页布局方式：custom(自定义)、page(单页)、profile(个人资料)、hero(英雄区)
  layout = "custom"
  # 首页 hero 区的一句话简介(custom.html 中引用)
  customSummary = "嵌入式开发学习笔记:整理 MCU、RTOS、操作系统、通信协议、C/C++ 等方向的知识点与原理剖析。"
  # 是否显示最近文章
  showRecent = false
  # 显示最近文章的数量
  showRecentItems = 10
  # 是否显示"查看更多"链接
  showMoreLink = true
  # "查看更多"链接的目标路径
  showMoreLinkDest = "/posts/"
  # 是否使用卡片视图展示文章
  cardView = true
  # 卡片视图是否占满屏幕宽度
  cardViewScreenWidth = false
  # 是否启用背景模糊效果
  layoutBackgroundBlur = false
  # 是否禁用英雄图片滤镜
  disableHeroImageFilter = false
  # 是否按年份分组显示文章
  groupByYear = true
  # 是否按权重排序（false则按日期排序）
  orderByWeight = false

[article]
  showDate = true
  showAuthor = true
  showHero = false
  showBreadcrumbs = false
  showDraftLabel = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = false
  showTableOfContents = false
  showWordCount = false

[list]
  showHero = false
  layoutBackgroundBlur = true
  layoutBackgroundHeaderSpace = true
  showBreadcrumbs = false
  showSummary = true
  showTableOfContents = false
  showCards = true
  orderByWeight = false
  groupByYear = true
  cardView = true
  cardViewScreenWidth = true
  constrainItemsWidth = false
